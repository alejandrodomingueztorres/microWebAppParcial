global
    log /dev/log local0
    log /dev/log local1 notice
    chroot /var/lib/haproxy
    stats socket /run/haproxy/admin.sock mode 660 level admin
    stats timeout 30s
    user haproxy
    group haproxy
    daemon

defaults
    log     global
    mode    http
    option  httplog
    option  dontlognull
    option  redispatch
    retries 3
    timeout connect 5s
    timeout client  30s
    timeout server  30s

# ---------- Entrada única: puerto 80 ----------
frontend http_front
    bind *:80
    acl is_users    path_beg /api/users /api/login
    acl is_products path_beg /api/products
    acl is_orders   path_beg /api/orders
    use_backend users_back    if is_users
    use_backend products_back if is_products
    use_backend orders_back   if is_orders

# ---------- Un backend por microservicio, 2 servidores cada uno ----------
backend users_back
    balance roundrobin
    option httpchk GET /health
    http-check expect status 200
    http-response set-header X-Served-By %s
    server users1 10.0.1.11:3001 check inter 2s fall 2 rise 2
    server users2 10.0.1.11:3011 check inter 2s fall 2 rise 2

backend products_back
    balance roundrobin
    option httpchk GET /health
    http-check expect status 200
    http-response set-header X-Served-By %s
    server products1 10.0.1.11:3002 check inter 2s fall 2 rise 2
    server products2 10.0.1.11:3012 check inter 2s fall 2 rise 2

backend orders_back
    balance roundrobin
    option httpchk GET /health
    http-check expect status 200
    http-response set-header X-Served-By %s
    server orders1 10.0.1.11:3003 check inter 2s fall 2 rise 2
    server orders2 10.0.1.11:3013 check inter 2s fall 2 rise 2

# ---------- Página de estadísticas ----------
listen stats
    bind *:8080
    stats enable
    stats uri /stats
    stats refresh 5s
    stats auth admin:mp2stats123
